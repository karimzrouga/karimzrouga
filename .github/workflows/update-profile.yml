name: Update profile
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    paths:
      - scripts/update_profile.py
      - .github/workflows/update-profile.yml
permissions:
  contents: write
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate stats and contribution city
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: karimzrouga
        run: python3 scripts/update_profile.py
      - name: Commit refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/city.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh GitHub profile visuals'
            git push
          fi
