<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title"><title id="title">city.svg — Mohamed Karim Zrouga</title><defs><linearGradient id="edge"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#172238" stroke-width=".6"/></pattern><clipPath id="panelClip"><rect width="1000" height="100%" rx="16"/></clipPath></defs><style>text{font-family:Arial,sans-serif;fill:#e6edf3}.muted{fill:#94a3b8}.cyan{fill:#60a5fa}.mono{font-family:monospace}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-6px)}}
.swing{animation:swing 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes swing{25%{transform:rotate(1.2deg)}75%{transform:rotate(-1.2deg)}}
.draw{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{animation:fade 1.2s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.float,.swing,.draw,.fade{animation:none;stroke-dashoffset:0}}
</style><rect width="1000" height="210" rx="16" fill="#120f16"/><rect width="1000" height="210" rx="16" fill="url(#grid)"/><rect x="1" y="1" width="998" height="208" rx="15" fill="none" stroke="#263347"/><text x="32" y="42" font-size="13" class="cyan mono">CONTRIBUTION CITY / WAITING FOR FIRST SYNC</text><text x="32" y="105" font-size="23" class="">A skyline built from your real daily contributions.</text><text x="32" y="147" font-size="16" class="muted">No sample numbers. The first workflow run generates your city.</text><g clip-path="url(#panelClip)" opacity=".22"><path d="M-150 0L-50 0L40 400L-60 400Z" fill="#60a5fa"><animateTransform attributeName="transform" type="translate" values="-200 0;1300 0" dur="13s" repeatCount="indefinite"/></path></g></svg>